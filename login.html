<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة إدارة البطولات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4ade80; /* أخضر نيون هادئ */
            --bg: #000000; /* خلفية سوداء بالكامل */
            --card: #0a0a0a; /* لون الكارد غامق جداً */
            --border: #1f1f1f;
            --input-bg: #0f0f0f;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(74, 222, 128, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(74, 222, 128, 0.05) 0%, transparent 20%);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .logo-area {
            font-size: 45px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        h2 {
            font-weight: 900;
            margin: 0;
            font-size: 22px;
            color: #fff;
            letter-spacing: -0.5px;
        }

        p.desc {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-box label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            font-weight: bold;
            padding-right: 4px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            transition: 0.3s;
            outline: none;
            text-align: center;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--primary);
            background: #000;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        /* التذييل باسمك ورقمك فقط */
        .dev-footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .dev-footer p {
            margin: 0;
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dev-footer a {
            color: #eee;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            display: block;
            margin-top: 4px;
        }

        .loader {
            display: none;
            margin-top: 15px;
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
        }

        #activationSection { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div id="loginSection">
            <h2>دخول المنظمين</h2>
            <p class="desc">نظام إدارة البطولات الذكي</p>

            <div class="input-box">
                <label>البريد الإلكتروني</label>
                <input type="email" id="emailInput" placeholder="email@example.com" dir="ltr">
            </div>

            <div class="input-box">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput" placeholder="••••••••" dir="ltr">
            </div>

            <button onclick="handleLogin()">تسجيل الدخول</button>
            <div id="loginLoader" class="loader">جاري التحقق...</div>
        </div>

        <div id="activationSection">
            <h2>توثيق الجهاز</h2>
            <p class="desc">أدخل كود التفعيل لمرة واحدة لربط حسابك بهذا الجهاز</p>

            <div class="input-box">
                <label>كود التفعيل</label>
                <input type="text" id="activationCode" placeholder="--------" maxlength="8" dir="ltr" style="letter-spacing: 4px; font-weight: 900; text-transform: uppercase;">
            </div>

            <button onclick="handleActivation()">تفعيل الجهاز الآن</button>
            <div id="activationLoader" class="loader">جاري التوثيق...</div>
        </div>

        <div class="dev-footer">
            <p>DESIGNED BY</p>
            <a href="tel:07717007839">محمد حمزة | 07717007839</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCfaXlGarmxWH8HkxDqdvOAtTqJaF0LXvg",
            authDomain: "kdcsaas.firebaseapp.com",
            projectId: "kdcsaas",
            databaseURL: "https://kdcsaas-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let tempUid = null;

        auth.onAuthStateChanged((user) => {
            if (user) verifySecurity(user.uid);
        });

        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if(!email || !pass) return alert("أكمل البيانات");
            document.getElementById('loginLoader').style.display = 'block';
            try { await auth.signInWithEmailAndPassword(email, pass); } 
            catch (e) { document.getElementById('loginLoader').style.display = 'none'; alert("خطأ في الدخول"); }
        }

        async function verifySecurity(uid) {
            const snap = await db.ref(`saas_users/${uid}`).once('value');
            const userData = snap.val();
            if (!userData || userData.status !== 'active') {
                alert("الحساب معطل"); auth.signOut(); location.reload(); return;
            }
            const localFingerprint = localStorage.getItem('secure_device_token');
            if (!userData.device_id) {
                tempUid = uid;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('activationSection').style.display = 'block';
            } else if (userData.device_id === localFingerprint) {
                window.location.href = "admin.html";
            } else {
                alert("هذا الحساب مرتبط بجهاز آخر"); auth.signOut(); location.reload();
            }
        }

        async function handleActivation() {
            const code = document.getElementById('activationCode').value.trim().toUpperCase();
            if(!code) return alert("أدخل الكود");
            document.getElementById('activationLoader').style.display = 'block';
            const codeSnap = await db.ref(`activation_codes/${code}`).once('value');
            if (codeSnap.val() && codeSnap.val().status === 'active') {
                const fingerprint = "DEVICE_" + Math.random().toString(36).substr(2, 10);
                await db.ref(`saas_users/${tempUid}`).update({ device_id: fingerprint });
                await db.ref(`activation_codes/${code}`).update({ status: 'used', used_by: tempUid });
                localStorage.setItem('secure_device_token', fingerprint);
                window.location.href = "admin.html";
            } else {
                document.getElementById('activationLoader').style.display = 'none';
                alert("الكود غير صالح");
            }
        }
    </script>
</body>
</html>
